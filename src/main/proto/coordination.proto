syntax = "proto3";
package distrilab.coordination.v1;
option java_package = "edu.usp.cs324.proto.coordination";
option java_multiple_files = true;
import "cluster.proto";
import "recovery.proto";

// Internal coordination transport. Submit/Assign have the original synchronous
// semantics; the durable job receipt/recovery protocol is a separate integration.
service CoordinationService {
  rpc GetStatus(Empty) returns (WorkerStatus);
  rpc Election(ElectionRequest) returns (ElectionReply);
  rpc Announce(CoordinatorTerm) returns (Empty);
  rpc Elect(Empty) returns (CoordinatorTerm);
  rpc Submit(distrilab.recovery.v1.RecoveryJobInput) returns (IntegerResult);
  rpc Assign(Assignment) returns (IntegerResult);
  rpc Compute(distrilab.recovery.v1.RecoveryJobInput) returns (IntegerResult);
}
message Empty {}
message CoordinatorTerm {
  int64 number = 1;
  string election_id = 2;
  distrilab.v1.WorkerEndpoint leader = 3;
}
message WorkerStatus {
  distrilab.v1.WorkerEndpoint worker = 1;
  int64 jac = 2;
  uint32 assigned_jobs = 3;
  CoordinatorTerm term = 4;
  repeated distrilab.v1.WorkerEndpoint neighbours = 5;
}
message ElectionRequest { string election_id = 1; }
message ElectionCandidate {
  distrilab.v1.WorkerEndpoint worker = 1;
  int64 jac = 2;
}
message ElectionReply { repeated ElectionCandidate candidates = 1; }
message Assignment {
  distrilab.recovery.v1.RecoveryJobInput input = 1;
  CoordinatorTerm term = 2;
  repeated distrilab.v1.WorkerEndpoint workers = 3;
}
message IntegerResult { string value = 1; }
