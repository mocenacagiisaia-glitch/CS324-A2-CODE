syntax = "proto3";

package distrilab.recovery.v1;
option java_package = "edu.usp.cs324.proto.recovery";
option java_multiple_files = true;
import "cluster.proto";

// One worker's checkpoint access. A successful save acknowledges this replica only;
// it does not certify a quorum, authorize a leader, or resume any job.
service RecoveryStateService {
  rpc SaveSnapshot(SaveRecoverySnapshotRequest) returns (SaveRecoverySnapshotReply);
  rpc GetSnapshot(GetRecoverySnapshotRequest) returns (GetRecoverySnapshotReply);
}

message SaveRecoverySnapshotRequest {
  RecoverySnapshot snapshot = 1;
}

message SaveRecoverySnapshotReply {
  // False for an identical replay; both outcomes acknowledge a persisted snapshot.
  bool written = 1;
  int64 revision = 2;
  int64 leadership_term = 3;
}

message GetRecoverySnapshotRequest {}

message GetRecoverySnapshotReply {
  // Absent when this replica has never stored a checkpoint.
  RecoverySnapshot snapshot = 1;
}

// Full checkpoint data. Saving this locally is not a quorum or a leadership grant.
// The coordination layer will decide which replicated checkpoint is authoritative.
message RecoverySnapshot {
  int64 revision = 1;
  int64 leadership_term = 2;
  string election_id = 3;
  uint32 coordinator_id = 4;
  string coordinator_incarnation_id = 5;
  repeated RecoveryJob jobs = 6;
  repeated RecoveryWorkerCounter worker_counters = 7;
  distrilab.v1.WorkerEndpoint coordinator_endpoint = 8;
}

message RecoveryJobInput {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    MAX = 1;
    PRIMESUM = 2;
    PRIMECOUNT = 3;
  }
  Operation operation = 1;
  repeated sint32 numbers = 2;
  sint32 range_start = 3;
  sint32 range_end = 4;
}

message RecoveryJob {
  enum State {
    JOB_STATE_UNSPECIFIED = 0;
    PENDING = 1;
    RUNNING = 2;
    COMPLETED = 3;
  }
  // Reuse this ID when reconnecting/retrying the same client request.
  string job_id = 1;
  RecoveryJobInput input = 2;
  State state = 3;
  repeated RecoveryTask tasks = 4;
  // Decimal BigInteger; presence distinguishes an absent result from the value zero.
  optional string result = 5;
}

message RecoveryTask {
  enum State {
    TASK_STATE_UNSPECIFIED = 0;
    PENDING = 1;
    RUNNING = 2;
    COMPLETED = 3;
  }
  string task_id = 1;
  RecoveryJobInput input = 2;
  State state = 3;
  uint32 assigned_worker_id = 4;
  string assigned_worker_incarnation_id = 5;
  // Increment on reassignment. A completed result belongs to this specific attempt.
  uint32 attempt = 6;
  optional string result = 7;
  int64 leadership_term = 8;
  string coordinator_incarnation_id = 9;
  uint32 coordinator_id = 10;
}

message RecoveryWorkerCounter {
  uint32 worker_id = 1;
  int64 jac = 2;
  uint32 assigned_jobs = 3;
}

// All mutations are routed to the lowest live directory member. This serializes
// full snapshots; it is a fail-stop lab protocol, not network-partition consensus.
service RecoveryControlService {
  rpc Mutate(RecoveryMutation) returns (RecoverySnapshot);
  rpc InstallCounters(RecoverySnapshot) returns (RecoveryControlAck);
}
message RecoveryControlAck {}
message RecoveryMutation {
  enum Action { ACTION_UNSPECIFIED = 0; REGISTER = 1; READ = 2; CLAIM = 3; COMPLETE = 4; RELEASE = 5; }
  Action action = 1;
  string job_id = 2;
  RecoveryJobInput input = 3;
  string task_id = 4;
  uint32 expected_attempt = 5;
  distrilab.v1.WorkerEndpoint worker = 6;
  string result = 7;
  int64 leadership_term = 8;
  string coordinator_incarnation_id = 9;
}
